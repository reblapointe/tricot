{% extends "base.html" %}

{% block titre %}
Choix du thème
{% endblock %}

{% block content %}

<h1>Choisir un thème</h1>

{% if erreur %}
<p class="erreur">
    {{ erreur }}
</p>
{% endif %}

<form action="/theme-action" method="POST">  

<select name="theme">
    {% for valeur in themes %}
    <option value="{{ valeur }}">{{ valeur }}</option>
    {% endfor %}
</select>

<br><br>

<button type="submit">
    Appliquer
</button>

</form>

{% endblock %}
