{% extends "base.html" %}
{% block title %}Thème{% endblock %}
{% block content %}

<h1>Choix du thème</h1>
<form action="/theme-action" method="POST">
    <select name="theme">
        {% for t in themes %}
        <option value="{{ t }}"{{ ' selected' if t == theme else '' }}>{{ t }}</option>
        {% endfor %}
    </select>
    <button type="submit">Appliquer</button>
</form>

{% endblock %}
